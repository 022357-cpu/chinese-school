<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 영단어장 (Day 1 ~ Day 8 전체 수록)</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --bg: #F3F4F6;
      --card-bg: #FFFFFF;
      --text: #1F2937;
      --text-sub: #6B7280;
      --accent: #10B981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px 10px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .progress-bar-container {
      background: #E5E7EB;
      border-radius: 10px;
      height: 12px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .progress-bar {
      background: var(--accent);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .stats {
      font-size: 0.9rem;
      color: var(--text-sub);
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    /* Day Main Tabs */
    .day-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .day-tab {
      background: #E5E7EB;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .day-tab.active {
      background: var(--primary);
      color: #FFF;
    }

    /* Sub Tabs & Controls */
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .sub-tabs {
      display: flex;
      gap: 6px;
    }

    .sub-tab {
      background: #FFFFFF;
      border: 1px solid #D1D5DB;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .sub-tab.active {
      border-color: var(--primary);
      color: var(--primary);
      font-weight: bold;
      background: #EEF2FF;
    }

    .search-input {
      padding: 8px 12px;
      border: 1px solid #D1D5DB;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      flex-grow: 1;
      max-width: 250px;
    }

    .btn-test {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Word Grid */
    .word-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 15px;
    }

    .word-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: transform 0.2s;
    }

    .word-card:hover {
      transform: translateY(-2px);
    }

    .word-card.memorized {
      opacity: 0.55;
      background: #F9FAFB;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .word-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--primary);
    }

    .pos {
      font-size: 0.75rem;
      color: #9CA3AF;
      font-style: italic;
      margin-left: 4px;
    }

    .audio-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .meaning {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 10px;
      color: #374151;
    }

    .example-box {
      background: #F9FAFB;
      border-left: 3px solid var(--primary);
      padding: 8px;
      border-radius: 4px;
      font-size: 0.82rem;
      color: var(--text-sub);
      margin-top: 8px;
    }

    .ex-en { font-style: italic; margin-bottom: 2px; }
    .ex-kr { color: #4B5563; }

    .card-bottom {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #F3F4F6;
      padding-top: 10px;
    }

    .day-badge {
      font-size: 0.75rem;
      background: #E0E7FF;
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: bold;
    }

    .check-btn {
      background: none;
      border: 1px solid #D1D5DB;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .check-btn.checked {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* Modal / Quiz */
    .modal {
      display: none;
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    .modal.active { display: flex; }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 450px;
      text-align: center;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 20px 0;
    }

    .quiz-opt {
      padding: 10px;
      border: 1px solid #D1D5DB;
      border-radius: 8px;
      cursor: pointer;
      background: #F9FAFB;
      font-weight: 500;
    }

    .quiz-opt:hover { background: #EEF2FF; }

    .close-btn {
      background: #6B7280;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>전체 필수 영단어장</h1>
    <div class="progress-bar-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="stats">
      <span>전체 수록 단어: <strong id="totalCount">0</strong>개</span>
      <span>암기 완료율: <strong id="progressPercent">0%</strong></span>
    </div>
  </header>

  <div class="day-tabs" id="dayTabs">
    <button class="day-tab active" data-day="all">전체</button>
    <button class="day-tab" data-day="1">Day 1</button>
    <button class="day-tab" data-day="2">Day 2</button>
    <button class="day-tab" data-day="3">Day 3</button>
    <button class="day-tab" data-day="4">Day 4</button>
    <button class="day-tab" data-day="5">Day 5</button>
    <button class="day-tab" data-day="6">Day 6</button>
    <button class="day-tab" data-day="7">Day 7</button>
    <button class="day-tab" data-day="8">Day 8</button>
  </div>

  <div class="controls">
    <div class="sub-tabs" id="subTabs">
      <button class="sub-tab active" data-filter="all">전체 보기</button>
      <button class="sub-tab" data-filter="unmemorized">미암기</button>
      <button class="sub-tab" data-filter="memorized">암기완료</button>
    </div>
    <input type="text" class="search-input" id="searchInput" placeholder="단어 또는 뜻 검색...">
    <button class="btn-test" onclick="startQuiz()">단어 테스트 시작</button>
  </div>

  <div class="word-grid" id="wordGrid"></div>
</div>

<div class="modal" id="quizModal">
  <div class="modal-content">
    <h3 style="margin-bottom:10px;">단어 테스트</h3>
    <h2 id="quizWord" style="color:var(--primary); margin-bottom:20px;">Word</h2>
    <div class="quiz-options" id="quizOptions"></div>
    <button class="close-btn" onclick="closeQuiz()">닫기</button>
  </div>
</div>

<script>

  const words = [

    { id: 4, day: 1, word: "accumulate", pos: "v.", meaning: "축적하다, 모으다", example: "Dust quickly accumulates on books.", exMeaning: "책 위에 먼지가 빠르게 쌓인다." },

    { id: 6, day: 1, word: "accuse", pos: "v.", meaning: "고발하다, 비난하다", example: "She was accused of stealing the money.", exMeaning: "그녀는 돈을 훔친 혐의로 고소당했다." },
    { id: 7, day: 1, word: "achieve", pos: "v.", meaning: "달성하다, 성취하다", example: "She achieved her dream of becoming a doctor.", exMeaning: "그녀는 의사가 되겠다는 꿈을 이뤘다." },
    { id: 8, day: 1, word: "acknowledge", pos: "v.", meaning: "인정하다, 승인하다", example: "He acknowledged his mistake publicly.", exMeaning: "그는 자신의 실수를 공개적으로 인정했다." },
    { id: 9, day: 1, word: "acquire", pos: "v.", meaning: "습득하다, 얻다", example: "Language skills are acquired through practice.", exMeaning: "언어 기술은 연습을 통해 습득된다." },

    { id: 11, day: 1, word: "adequate", pos: "adj.", meaning: "충분한, 적절한", example: "Make sure you get adequate rest.", exMeaning: "충분한 휴식을 취하도록 하세요." },

    { id: 13, day: 1, word: "admire", pos: "v.", meaning: "감탄하다, 존경하다", example: "I admire her dedication to work.", exMeaning: "나는 그녀의 일에 대한 헌신에 감탄한다." },

    // Day 2
    { id: 16, day: 2, word: "advocate", pos: "v./n.", meaning: "옹호하다, 주창자", example: "She advocates for environmental protection.", exMeaning: "그녀는 환경 보호를 옹호한다." },

    { id: 28, day: 2, word: "apparent", pos: "adj.", meaning: "명백한, 언뜻 보기에 ~인", example: "It became apparent that he was lying.", exMeaning: "그가 거짓말을 하고 있다는 것이 명백해졌다." },

    // Day 3
    { id: 31, day: 3, word: "appreciate", pos: "v.", meaning: "감사하다, 진가를 알아보다", example: "I really appreciate your help.", exMeaning: "당신의 도움에 진심으로 감사드립니다." },
    { id: 32, day: 3, word: "approach", pos: "v./n.", meaning: "접근하다, 접근법", example: "A new approach is needed to solve this problem.", exMeaning: "이 문제를 해결하려면 새로운 접근법이 필요하다." },

  // App State
  let memorizedIds = JSON.parse(localStorage.getItem('memorizedWords')) || [];
  let currentDay = 'all';
  let currentFilter = 'all';
  let searchQuery = '';

  // DOM Elements
  const wordGrid = document.getElementById('wordGrid');
  const progressBar = document.getElementById('progressBar');
  const totalCountEl = document.getElementById('totalCount');
  const progressPercentEl = document.getElementById('progressPercent');

  // Filter & Render
  function render() {
    let filtered = words.filter(w => {
      const matchDay = (currentDay === 'all') || (w.day.toString() === currentDay);
      const isMem = memorizedIds.includes(w.id);
      const matchFilter = (currentFilter === 'all') ||
                          (currentFilter === 'memorized' && isMem) ||
                          (currentFilter === 'unmemorized' && !isMem);
      const matchSearch = w.word.toLowerCase().includes(searchQuery.toLowerCase()) ||
                          w.meaning.includes(searchQuery);
      return matchDay && matchFilter && matchSearch;
    });

    wordGrid.innerHTML = '';
    filtered.forEach(w => {
      const isMem = memorizedIds.includes(w.id);
      const card = document.createElement('div');
      card.className = `word-card ${isMem ? 'memorized' : ''}`;
      card.innerHTML = `
        <div>
          <div class="card-top">
            <div>
              <span class="word-title">${w.word}</span>
              <span class="pos">${w.pos}</span>
            </div>
            <button class="audio-btn" onclick="speak('${w.word}')" title="발음 듣기">🔊</button>
          </div>
          <div class="meaning">${w.meaning}</div>
          <div class="example-box">
            <div class="ex-en">${w.example}</div>
            <div class="ex-kr">${w.exMeaning}</div>
          </div>
        </div>
        <div class="card-bottom">
          <span class="day-badge">Day ${w.day}</span>
          <button class="check-btn ${isMem ? 'checked' : ''}" onclick="toggleMemorize(${w.id})">
            ${isMem ? '✓ 암기완료' : '미암기'}
          </button>
        </div>
      `;
      wordGrid.appendChild(card);
    });

    updateStats();
  }

  function updateStats() {
    const total = words.length;
    const memCount = memorizedIds.length;
    const percent = Math.round((memCount / total) * 100) || 0;

    totalCountEl.innerText = total;
    progressPercentEl.innerText = `${percent}%`;
    progressBar.style.width = `${percent}%`;
  }

  function toggleMemorize(id) {
    if (memorizedIds.includes(id)) {
      memorizedIds = memorizedIds.filter(item => item !== id);
    } else {
      memorizedIds.push(id);
    }
    localStorage.setItem('memorizedWords', JSON.stringify(memorizedIds));
    render();
  }

  function speak(text) {
    if ('speechSynthesis' in window) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      window.speechSynthesis.speak(utterance);
    }
  }

  // Event Listeners
  document.getElementById('dayTabs').addEventListener('click', (e) => {
    if (e.target.classList.contains('day-tab')) {
      document.querySelectorAll('.day-tab').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentDay = e.target.dataset.day;
      render();
    }
  });

  document.getElementById('subTabs').addEventListener('click', (e) => {
    if (e.target.classList.contains('sub-tab')) {
      document.querySelectorAll('.sub-tab').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentFilter = e.target.dataset.filter;
      render();
    }
  });

  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value;
    render();
  });

  // Quiz Logic
  function startQuiz() {
    const targetWords = currentDay === 'all' ? words : words.filter(w => w.day.toString() === currentDay);
    if(targetWords.length < 4) {
      alert("테스트를 진행하려면 최소 4개 이상의 단어가 필요합니다.");
      return;
    }

    const randomWord = targetWords[Math.floor(Math.random() * targetWords.length)];
    document.getElementById('quizWord').innerText = randomWord.word;

    // Generate options
    let options = [randomWord.meaning];
    while(options.length < 4) {
      const randOption = words[Math.floor(Math.random() * words.length)].meaning;
      if(!options.includes(randOption)) {
        options.push(randOption);
      }
    }
    options.sort(() => Math.random() - 0.5);

    const optsContainer = document.getElementById('quizOptions');
    optsContainer.innerHTML = '';
    options.forEach(opt => {
      const btn = document.createElement('div');
      btn.className = 'quiz-opt';
      btn.innerText = opt;
      btn.onclick = () => {
        if(opt === randomWord.meaning) {
          alert('정답입니다! 🎉');
        } else {
          alert(`오답입니다! 정답은: ${randomWord.meaning}`);
        }
        startQuiz(); // next
      };
      optsContainer.appendChild(btn);
    });

    document.getElementById('quizModal').classList.add('active');
  }

  function closeQuiz() {
    document.getElementById('quizModal').classList.remove('active');
  }

  // Initial Render
  render();
</script>
